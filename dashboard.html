<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chartjs-DasBoard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
</head>
<body>
  <h3>--Gráfico em linhas--</h3>
    <div>
        <canvas id="div_linhas"></canvas>
      </div><br><br><br><br><br><br><br><br>
      <h3>--Gráfico em barras--</h3>
      <div>
        <canvas id="div_barras"></canvas>
      </div>
      
</body>

<script>
   const linha = document.getElementById('div_linhas');
  
  new Chart(linha, {
    type: 'line',
    data: {
      labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
      datasets: [{
        label: 'Temperatura',
        data: [30, 29, 28, 25, 22,13],
        borderWidth: 1
      },{
        label: 'Umidade',
        data: [80, 82, 80, 85, 80, 83],
        borderWidth: 1
      }]
    },
    
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
    const barra = document.getElementById('div_barras');
  
    new Chart(barra, {
      type: 'bar',
      data: {
        labels: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'],
        datasets: [{
          label: 'Temperatura',
          data: [22, 24, 27, 23, 20, 18],
          borderWidth: 1
        },{
          label: 'Umidade',
          data: [90, 89, 93, 87, 88, 82],
          borderWidth: 1
        }]
      },
      
      options: {
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  </script>
</html>
